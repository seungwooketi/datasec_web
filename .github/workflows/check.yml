# 검사 → 배포. ⭐ **게이트가 배포를 막는다.** `--strict` 가 실패하면 아무것도 올라가지 않는다.
#
# ⚠️ 이 리포의 Pages 는 `build_type: workflow` 다. 즉 브랜치에 푸시한다고 저절로 배포되지 않고,
#    `actions/deploy-pages` 를 부르는 워크플로가 있어야 한다. 그게 없어서 커밋 넷이
#    **에러 없이** 배포되지 않은 채로 있었다 — CI 는 초록이고 사이트만 옛 모습이었다.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # ⭐ 날짜가 된 예약 소식을 싣고, 마감이 지난 채용 카드를 빼는 매일 빌드. 10:13 KST(01:13 UTC) —
  #    블로그 원문(09:05 KST 재빌드)이 먼저 열리도록 늦게 둔다. 손으로 돌릴 때는 Actions 의 Run workflow.
  #    ⚠️ 정시에 돌지 않는다. 실측 시작은 14:30~15:10 KST 다 — 시각에 기대는 일(채용 마감 숨김)은
  #    JS 가 맡고, 이 빌드는 날짜 단위 정리만 한다.
  schedule:
    - cron: "13 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 다시 굽는다
        run: python3 build.py

      # ⚠️ 예약/수동 빌드는 날짜가 된 소식이 새로 실리므로 docs/ 가 커밋과 달라지는 것이 정상이다.
      #    이 검사는 push/PR 에서만 한다. 예약 빌드는 다시 구운 docs/ 를 그대로 배포한다.
      - name: docs/ 가 원본과 맞나
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs; then
            echo '::error::docs/ 가 원본과 다르다 — python3 build.py 를 돌리고 결과를 함께 커밋하라.'
            git diff --stat -- docs
            exit 1
          fi

      - name: 깨진 내부 링크가 있나
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          out = pathlib.Path("docs")
          bad = []
          for f in out.rglob("*.html"):
              for m in re.finditer(r'(?:href|src)="(/[^"#?]*)', f.read_text(encoding="utf-8")):
                  p = out / m.group(1).lstrip("/")
                  if p.is_dir():
                      p = p / "index.html"
                  if not p.exists():
                      bad.append(f"{f.relative_to(out)} → {m.group(1)}")
          for b in sorted(set(bad)):
              print(f"::error::깨진 링크 {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: ⛔ 공개 차단 사유가 남아 있나
        run: python3 build.py --strict

      - name: 산출물을 올린다
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
