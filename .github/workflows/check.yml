# 검사 → 배포. ⭐ **게이트가 배포를 막는다.** `--strict` 가 실패하면 아무것도 올라가지 않는다.
#
# ⚠️ 이 리포의 Pages 는 `build_type: workflow` 다. 즉 브랜치에 푸시한다고 저절로 배포되지 않고,
#    `actions/deploy-pages` 를 부르는 워크플로가 있어야 한다. 그게 없어서 커밋 넷이
#    **에러 없이** 배포되지 않은 채로 있었다 — CI 는 초록이고 사이트만 옛 모습이었다.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 다시 굽는다
        run: python3 build.py

      - name: docs/ 가 원본과 맞나
        run: |
          if ! git diff --quiet -- docs; then
            echo '::error::docs/ 가 원본과 다르다 — python3 build.py 를 돌리고 결과를 함께 커밋하라.'
            git diff --stat -- docs
            exit 1
          fi

      - name: 깨진 내부 링크가 있나
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          out = pathlib.Path("docs")
          bad = []
          for f in out.rglob("*.html"):
              for m in re.finditer(r'(?:href|src)="(/[^"#?]*)', f.read_text(encoding="utf-8")):
                  p = out / m.group(1).lstrip("/")
                  if p.is_dir():
                      p = p / "index.html"
                  if not p.exists():
                      bad.append(f"{f.relative_to(out)} → {m.group(1)}")
          for b in sorted(set(bad)):
              print(f"::error::깨진 링크 {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: ⛔ 공개 차단 사유가 남아 있나
        run: python3 build.py --strict

      - name: 산출물을 올린다
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
